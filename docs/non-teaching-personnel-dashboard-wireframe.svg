<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc">
<title id="title">Non-teaching personnel dashboard wireframe</title><desc id="desc">Staff portal navigation, greeting, four daily attendance periods, a monthly completion chart and recent attendance scans.</desc>
