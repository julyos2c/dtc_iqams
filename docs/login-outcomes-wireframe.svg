<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">IQAMS login outcomes and first-time password change</title><desc id="desc">Wireframes showing invalid credentials, inactive account, mandatory password change and routing to the authenticated user's role dashboard.</desc>
<style>text{font-family:Arial,sans-serif;fill:#333}.small{font-size:14px}.label{font-size:16px}.sub{font-size:20px;font-weight:bold}.box{fill:white;stroke:#777;stroke-width:2}.gray{fill:#eee;stroke:#777;stroke-width:2}.line{fill:none;stroke:#777;stroke-width:2}</style>
<rect width="1500" height="900" fill="white"/><text x="40" y="45" font-size="26" font-weight="bold">Login outcomes and dashboard access</text><text x="40" y="72" class="small">Follow the login page wireframe with these states and the role-specific dashboard.</text>
<text x="40" y="118" class="sub">1. Invalid credentials</text><rect x="40" y="135" width="430" height="435" class="box"/><text x="65" y="175" class="sub">Sign in to your account</text><text x="65" y="220" class="label">User ID</text><rect x="65" y="230" width="380" height="40" class="box"/><text x="65" y="296" class="small">These credentials do not match our records.</text><text x="65" y="335" class="label">Password</text><rect x="65" y="345" width="380" height="40" class="box"/><rect x="65" y="420" width="380" height="44" class="gray"/><text x="255" y="447" text-anchor="middle" class="label">Login</text><text x="65" y="520" class="small">Remain on login; user can try again.</text>
<text x="535" y="118" class="sub">2. Inactive account</text><rect x="535" y="135" width="430" height="435" class="box"/><text x="560" y="175" class="sub">Sign in to your account</text><text x="560" y="220" class="label">User ID</text><rect x="560" y="230" width="380" height="40" class="box"/><text x="560" y="296" class="small">This account is inactive. Please contact the</text><text x="560" y="316" class="small">administrator.</text><text x="560" y="355" class="label">Password</text><rect x="560" y="365" width="380" height="40" class="box"/><rect x="560" y="440" width="380" height="44" class="gray"/><text x="750" y="467" text-anchor="middle" class="label">Login</text><text x="560" y="530" class="small">Dashboard access is blocked.</text>
<text x="1030" y="118" class="sub">3. Required password change</text><rect x="1030" y="135" width="430" height="435" class="box"/><text x="1055" y="175" class="sub">Change your password</text><text x="1055" y="203" class="small">A new password is required before continuing.</text><text x="1055" y="239" class="label">Current password</text><rect x="1055" y="248" width="380" height="38" class="box"/><text x="1055" y="317" class="label">New password</text><rect x="1055" y="326" width="380" height="38" class="box"/><text x="1055" y="395" class="label">Confirm new password</text><rect x="1055" y="404" width="380" height="38" class="box"/><text x="1055" y="484" class="small" text-decoration="underline">Forgot current password?</text><rect x="1260" y="462" width="175" height="40" class="gray"/><text x="1347" y="488" text-anchor="middle" class="small">Update password</text><text x="1389" y="540" class="small" text-decoration="underline">Logout</text>
<rect x="40" y="630" width="1420" height="210" fill="#f5f5f5" stroke="#777" stroke-width="2"/><text x="65" y="667" class="sub">Access flow</text><rect x="65" y="700" width="220" height="62" class="box"/><text x="175" y="737" text-anchor="middle" class="label">Submit login</text><path d="M285 731 H325" class="line"/><text x="310" y="724" class="small">›</text><rect x="325" y="700" width="260" height="62" class="box"/><text x="455" y="726" text-anchor="middle" class="small">Valid credentials and</text><text x="455" y="746" text-anchor="middle" class="small">active account</text><path d="M585 731 H625" class="line"/><text x="610" y="724" class="small">›</text><rect x="625" y="700" width="300" height="62" class="box"/><text x="775" y="726" text-anchor="middle" class="small">Password change required?</text><text x="775" y="746" text-anchor="middle" class="small">If yes, complete step 3</text><path d="M925 731 H965" class="line"/><text x="950" y="724" class="small">›</text><rect x="965" y="700" width="445" height="62" class="box"/><text x="1187" y="726" text-anchor="middle" class="small">Dashboard for authenticated role</text><text x="1187" y="746" text-anchor="middle" class="small">Admin shown first; instructor, staff or student as applicable</text><text x="65" y="803" class="small">Invalid credentials or an inactive account return to login with the relevant message; no dashboard access.</text>
</svg>
