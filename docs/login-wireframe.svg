<text x="570" y="340" class="label">User ID</text><rect x="570" y="350" width="290" height="43" class="box"/><text x="585" y="377" class="small" fill="#777">Student or employee ID</text>
<text x="570" y="425" class="label">Password</text><rect x="570" y="435" width="290" height="43" class="box"/><text x="585" y="462" class="small">Enter your password</text><text x="821" y="462" class="small">Show</text>
<rect x="570" y="502" width="15" height="15" class="box"/><text x="593" y="515" class="small">Remember me</text><text x="756" y="515" class="small" text-decoration="underline">Forgot password?</text>
