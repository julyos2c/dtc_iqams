<text x="1065" y="250" class="small">WELCOME BACK</text><text x="1065" y="280" font-size="21" font-weight="bold">Sign in to your account</text><text x="1065" y="305" class="small">Enter your credentials to access</text><text x="1065" y="323" class="small">your dashboard.</text>
<text x="1065" y="358" class="label">User ID</text><rect x="1065" y="367" width="260" height="42" class="box"/><text x="1078" y="394" class="small">Student or employee ID</text>
