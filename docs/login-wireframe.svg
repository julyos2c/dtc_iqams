<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">IQAMS login page low-fidelity wireframe</title>
<desc id="desc">Desktop and mobile layouts for the existing IQAMS login page, showing branding, user ID and password fields, remember me, forgot password, login, and privacy notice.</desc>
<style>text{font-family:Arial,sans-serif;fill:#333}.label{font-size:16px}.small{font-size:13px}.heading{font-size:24px;font-weight:bold}.caption{font-size:18px;font-weight:bold}.line{stroke:#777;stroke-width:2;fill:none}.box{fill:#fff;stroke:#777;stroke-width:2}.muted{fill:#e6e6e6;stroke:#999;stroke-width:2}</style>
<rect width="1440" height="920" fill="#fff"/>
<text x="50" y="48" font-size="28" font-weight="bold">Login page — low-fidelity wireframe</text>
<text x="50" y="75" class="small">IQAMS · Layout and content based on the current login page</text>
<text x="50" y="115" class="caption">Desktop</text>
<rect x="50" y="130" width="900" height="650" fill="#eee" stroke="#777" stroke-width="2"/>
<line x1="50" y1="130" x2="950" y2="780" stroke="#ccc"/><line x1="950" y1="130" x2="50" y2="780" stroke="#ccc"/>
