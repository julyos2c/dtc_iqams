<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
<title id="title">Teaching personnel dashboard wireframe</title><desc id="desc">Instructor portal navigation, greeting, four attendance periods, monthly attendance chart, optional warnings and next teaching schedule.</desc>
<style>text{font-family:Arial,sans-serif;fill:#333}.small{font-size:14px}.nav{font-size:16px}.heading{font-size:25px;font-weight:bold}.sub{font-size:19px;font-weight:bold}.box{fill:white;stroke:#888;stroke-width:2}.gray{fill:#e8e8e8;stroke:#888;stroke-width:2}.line{fill:none;stroke:#888;stroke-width:2}</style>
<rect width="1500" height="1040" fill="white"/><text x="35" y="40" font-size="25" font-weight="bold">Teaching Personnel Dashboard</text><text x="35" y="65" class="small">Low-fidelity wireframe based on the existing instructor portal · Values are placeholders</text>
<rect x="35" y="85" width="1430" height="900" fill="#f5f5f5" stroke="#777" stroke-width="2"/><rect x="35" y="85" width="245" height="900" fill="#e5e5e5" stroke="#888" stroke-width="2"/>
<circle cx="70" cy="125" r="20" class="box"/><text x="66" y="131" class="small">I</text><text x="105" y="124" class="sub">IQAMS</text><text x="105" y="144" class="small">Instructor Portal</text><rect x="50" y="185" width="215" height="44" class="box"/><text x="68" y="213" class="nav">Dashboard</text><text x="68" y="268" class="nav">My Attendance</text><text x="68" y="323" class="nav">My Teaching Schedule</text><text x="68" y="378" class="nav">Monthly Summary</text><text x="68" y="433" class="nav">Attendance Issues</text><text x="68" y="488" class="nav">Leave Requests</text><text x="68" y="860" class="small">“Consistency is the key</text><text x="68" y="880" class="small">to excellence.”</text><line x1="35" y1="905" x2="280" y2="905" class="line"/><text x="68" y="950" class="nav">Logout</text>
<rect x="280" y="85" width="1185" height="80" class="box"/><text x="310" y="118" class="heading">Good morning, [Instructor name]!</text><text x="310" y="144" class="small">Teaching Personnel · [Department]</text><rect x="1125" y="105" width="170" height="40" class="box"/><text x="1140" y="130" class="small">[Current date]</text><rect x="1310" y="105" width="65" height="40" class="box"/><text x="1318" y="130" class="small">[Bell]</text><circle cx="1420" cy="125" r="21" class="gray"/><text x="1414" y="130" class="small">I</text>
<rect x="310" y="195" width="1120" height="245" class="box"/><text x="335" y="230" class="sub">Today's attendance</text><text x="335" y="253" class="small">Your four daily attendance periods</text><text x="335" y="287" class="small">[0] of 4 completed · [0%]</text><rect x="1280" y="264" width="120" height="30" class="gray"/><text x="1294" y="284" class="small">[Status]</text><line x1="380" y1="322" x2="1360" y2="322" stroke="#999" stroke-width="5"/>
<circle cx="420" cy="322" r="11" class="box"/><circle cx="715" cy="322" r="11" class="box"/><circle cx="1010" cy="322" r="11" class="box"/><circle cx="1310" cy="322" r="11" class="box"/><text x="420" y="355" text-anchor="middle" class="small">Morning In</text><text x="715" y="355" text-anchor="middle" class="small">Lunch Out</text><text x="1010" y="355" text-anchor="middle" class="small">Afternoon In</text><text x="1310" y="355" text-anchor="middle" class="small">Final Out</text><text x="420" y="377" text-anchor="middle" class="small">[Record status]</text><text x="715" y="377" text-anchor="middle" class="small">[Record status]</text><text x="1010" y="377" text-anchor="middle" class="small">[Record status]</text><text x="1310" y="377" text-anchor="middle" class="small">[Record status]</text><line x1="335" y1="394" x2="1400" y2="394" class="line"/><text x="335" y="420" class="small">Next: [attendance period]</text>
<rect x="310" y="460" width="710" height="115" class="box"/><text x="335" y="494" class="sub">Attendance Warnings</text><text x="910" y="494" class="small" text-decoration="underline">Review</text><text x="335" y="525" class="small">[Student name] · [Subject] · [Absence count]</text><text x="335" y="550" class="small">Shown when student attendance warnings exist.</text>
<rect x="310" y="595" width="710" height="340" class="box"/><text x="335" y="630" class="sub">My Attendance This Month</text><text x="335" y="653" class="small">Daily completion of your four attendance periods</text><text x="885" y="630" class="small">[Month / year]</text><path d="M380 860 H980 M380 860 V685" class="line"/><text x="335" y="700" class="small">100%</text><text x="350" y="780" class="small">50%</text><text x="355" y="864" class="small">0%</text><polyline points="380,800 470,730 560,760 650,700 740,745 830,710 920,735 980,705" class="line"/><text x="380" y="890" class="small">[Days of month]</text><text x="335" y="916" class="small">— Daily completion     ○ Complete     ○ Incomplete     ○ Absent</text>
<rect x="1040" y="460" width="390" height="270" class="box"/><text x="1065" y="497" class="sub">Next Teaching Schedule</text><text x="1065" y="522" class="small">Your upcoming class today</text><rect x="1065" y="545" width="340" height="150" class="gray"/><text x="1085" y="577" class="small">[Start time] – [End time]</text><text x="1085" y="612" class="sub">[Subject name]</text><text x="1085" y="650" class="small">[Section]                         Room [number]</text><text x="1065" y="712" class="small">Empty state: No upcoming teaching schedule today.</text>
<rect x="1230" y="155" width="190" height="73" class="box"/><text x="1250" y="182" class="small">Profile</text><text x="1250" y="208" class="small">Settings</text></svg>
