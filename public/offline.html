<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Connection unavailable | IQAMS</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #fff; color: #142334; font-family: system-ui, -apple-system, sans-serif; }
        main { width: 100%; max-width: 480px; text-align: center; }
        .illustration { display: block; width: min(100%, 200px); height: auto; margin: 0 auto 20px; }
        h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.2; letter-spacing: -.035em; }
        p { margin: 0; color: #69798a; font-size: 15px; line-height: 1.6; }
        button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: min(100%, 200px); min-height: 46px; margin-top: 24px; padding: 10px 14px; border: 0; border-radius: 999px; background: #0b857a; color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1.2; cursor: pointer; }
        button svg { width: 20px; height: 20px; flex: none; }
        button:hover { background: #086e66; }
        button:focus-visible { outline: 3px solid #5eead4; outline-offset: 4px; }
        .status { margin-top: 16px; font-size: 15px; }
        .status:empty { display: none; }
        @media (max-width: 480px) { body { padding: 20px; } h1 { font-size: 24px; } }
    </style>
</head>
<body>
    <main>
        <svg class="illustration" viewBox="0 0 380 290" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="172" cy="271" rx="125" ry="11" fill="#EDF0F2"/>
            <path d="M50 225c25-32 31-61 39-93 11-47 42-73 82-73 42 0 71 31 71 76 0 39-12 82-25 115-5 13-15 16-27 12-11-4-15-4-27 1-15 6-26 3-37-5-10-8-20-11-34-9-25 3-51-7-42-24Z" fill="#FAFBFC" stroke="#89969F" stroke-width="5" stroke-linejoin="round"/>
            <path d="M67 225c22-32 29-60 36-91 9-38 30-61 58-67-39 14-42 51-49 84-7 37-22 66-45 74Zm22 22c17-10 27-27 38-43-2 18-8 34-19 46Zm63 14c19-11 29-31 40-50-2 21-8 39-19 49Z" fill="#F0F2F4"/>
            <ellipse cx="166" cy="129" rx="10" ry="16" fill="#89969F"/><ellipse cx="206" cy="129" rx="10" ry="16" fill="#89969F"/>
            <path d="M211 175c23-13 35 7 55 5 10-1 17-7 22-15m-23 15c8 6 11 12 9 18" stroke="#89969F" stroke-width="6" stroke-linecap="round"/>
            <path d="m277 145 15-23 32 20-15 23c-5 8-15 10-23 5l-3-2c-8-5-11-15-6-23Z" fill="#89969F"/><path d="m292 123 7-11m10 22 7-11" stroke="#89969F" stroke-width="6" stroke-linecap="round"/>
            <path d="M252 42c31-32 79-32 110 0M270 59c21-21 53-21 74 0M286 76c12-12 28-12 40 0" stroke="#89969F" stroke-width="8" stroke-linecap="round"/><circle cx="306" cy="91" r="9" fill="#89969F"/>
            <circle cx="345" cy="81" r="26" fill="#F5646B" stroke="#fff" stroke-width="3"/><path d="m336 72 18 18m0-18-18 18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
            <path d="m65 58-17-14m38 4-6-20M54 89l-22-6" stroke="#89969F" stroke-width="5" stroke-linecap="round"/>
        </svg>
        <h1>Connection Unavailable</h1>
        <p>Can't be reached right now. Check your internet connection and try again.</p>
        <button id="retry" type="button"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M19 12a7 7 0 1 1-2-5l3 5"/></svg>Retry Connection</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>
    <script>
        const status = document.getElementById('status');
        window.addEventListener('online', () => { status.textContent = 'Connection restored. You can retry now.'; });
        window.addEventListener('offline', () => { status.textContent = 'Your device appears to be offline.'; });
        document.getElementById('retry').addEventListener('click', () => { window.location.reload(); });
    </script>
</body>
</html>
